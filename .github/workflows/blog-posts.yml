name: Update latest blog posts

on:
  schedule:
    - cron: "30 22 * * *" # daily at 04:30 Dhaka time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update-blog.mjs", ".github/workflows/blog-posts.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pull the newest posts into README.md
        run: node scripts/update-blog.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update latest blog posts"
          git pull --rebase
          git push
