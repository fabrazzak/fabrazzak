<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="wave emoji">
<title>wave emoji</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif}
.mono{font-family:'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;white-space:pre}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs></defs>
<g><animateTransform attributeName="transform" type="rotate" values="0 64 100;18 64 100;-8 64 100;18 64 100;-4 64 100;0 64 100;0 64 100" keyTimes="0;.12;.24;.36;.48;.6;1" dur="2.6s" repeatCount="indefinite"/><image xlink:href="data:image/png;base64," x="12" y="12" width="96" height="96"/></g>
</svg>
