<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="Section divider">
<title>Section divider</title>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif}
.mono{font-family:'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;white-space:pre}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".25" stop-color="#22D3EE" stop-opacity=".6"/><stop offset=".5" stop-color="#A78BFA" stop-opacity=".6"/><stop offset=".75" stop-color="#F472B6" stop-opacity=".6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
<linearGradient id="comet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".85" stop-color="#22D3EE"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect x="0" y="13.25" width="1200" height="1.5" fill="url(#line)"/>
<rect x="-240" y="12.5" width="240" height="3" rx="1.5" fill="url(#comet)"><animate attributeName="x" values="-240;1200" dur="3.6s" repeatCount="indefinite"/></rect>
<rect x="578" y="10" width="8" height="8" fill="#22D3EE" transform="rotate(45 582 14)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0s" repeatCount="indefinite"/></rect><rect x="596" y="10" width="8" height="8" fill="#A78BFA" transform="rotate(45 600 14)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></rect><rect x="614" y="10" width="8" height="8" fill="#F472B6" transform="rotate(45 618 14)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></rect>
</svg>
